apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: local-network-pool
  namespace: metallb-system
spec:
  addresses:
    - 172.26.15.168-172.26.15.168
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: local-network-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - local-network-pool